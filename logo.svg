<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Rich Metallic Gold Gradient matching luxury gold foil embossing -->
    <linearGradient id="ebGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED596"/>
      <stop offset="22%" stop-color="#C5A059"/>
      <stop offset="48%" stop-color="#FFF2CE"/>
      <stop offset="74%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9A7732"/>
    </linearGradient>

    <!-- Subtle luxury paper texture background -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1A1C1F"/>
      <stop offset="70%" stop-color="#121315"/>
      <stop offset="100%" stop-color="#0D0E10"/>
    </radialGradient>

    <!-- Golden drop shadow filter -->
    <filter id="goldGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Luxury Dark Charcoal/Black Background -->
  <rect width="500" height="500" fill="url(#bgGlow)"/>

  <!-- Logo Group -->
  <g filter="url(#goldGlow)" stroke="url(#ebGoldGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    
    <!-- 1. Outer Elephant Back & Wave Line -->
    <!-- Starts from rear baseline, arches up back, flows into cresting ocean wave, joins head -->
    <path d="M 172 290 
             L 155 290 
             L 156 225 
             C 156 180, 185 160, 240 162 
             C 246 162, 252 163, 258 165" />

    <!-- Ocean wave crest flowing through the elephant's body -->
    <path d="M 156 222 
             C 180 222, 195 190, 218 185 
             C 238 180, 252 195, 242 216 
             C 234 228, 218 226, 212 214 
             C 208 206, 215 196, 228 195" />

    <!-- 2. Elephant Head & Stylized Ear -->
    <!-- Dome of head -->
    <path d="M 252 170 
             C 265 160, 285 162, 290 174 
             C 294 182, 288 198, 282 208 
             C 275 220, 266 230, 268 238 
             C 270 244, 276 236, 278 228 
             C 282 210, 290 195, 286 178" />

    <!-- Stylized curved Ear Contour -->
    <path d="M 268 162 
             C 255 164, 242 178, 242 202 
             C 242 224, 258 232, 266 226 
             C 274 218, 272 195, 271 185" />

    <!-- 3. Forehead to Trunk -->
    <!-- Forehead arch flowing smoothly down into curling trunk -->
    <path d="M 288 168 
             C 308 174, 324 195, 325 222 
             C 326 238, 332 254, 332 268 
             C 332 278, 324 286, 312 284 
             C 304 282, 300 274, 304 266 
             C 307 260, 314 262, 316 266" />

    <!-- 4. Graceful Tusk extending forward -->
    <path d="M 302 228 
             C 316 234, 336 238, 348 236 
             C 334 242, 318 245, 305 244" />

    <!-- 5. Front Body / Chest line -->
    <path d="M 298 250 
             C 292 262, 288 274, 288 290" />

    <!-- 6. Arched Underbelly Dome -->
    <path d="M 180 290 
             C 192 260, 222 244, 260 244 
             C 280 244, 295 252, 300 262" />

    <!-- 7. Base Line for Feet -->
    <path d="M 170 290 L 195 290" stroke-width="8" />

    <!-- 8. Coconut Palm Tree under the belly -->
    <!-- Palm trunk with tropical lean -->
    <path d="M 270 290 
             C 269 276, 265 264, 263 248" stroke-width="6" />
    <path d="M 280 290 
             C 278 278, 274 266, 270 252" stroke-width="5" />

    <!-- Palm Fronds radiating left, top and right -->
    <!-- Left fronds -->
    <path d="M 264 250 C 254 248, 238 254, 234 264" stroke-width="5" />
    <path d="M 264 252 C 250 255, 238 266, 236 274" stroke-width="4.5" />
    <path d="M 265 254 C 255 264, 245 274, 245 284" stroke-width="4" />

    <!-- Center/Top fronds -->
    <path d="M 265 248 C 263 238, 260 234, 258 234" stroke-width="4.5" />
    <path d="M 267 248 C 269 236, 275 234, 278 234" stroke-width="4.5" />

    <!-- Right fronds -->
    <path d="M 268 250 C 280 246, 294 252, 298 260" stroke-width="5" />
    <path d="M 270 252 C 282 256, 295 264, 298 274" stroke-width="4.5" />
    <path d="M 271 254 C 280 264, 290 274, 292 282" stroke-width="4" />
  </g>
</svg>
